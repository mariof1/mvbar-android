name: Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        type: choice
        options: [dev, release]
        default: dev
      version_bump:
        description: Version bump (release only)
        required: false
        type: choice
        options: [patch, minor, major, custom]
        default: patch
      custom_version:
        description: Custom version (for a custom release bump)
        required: false
        type: string
      modules:
        description: APK modules (tagged releases always include phone, TV, and Wear)
        required: true
        type: choice
        options: [app, tv, all]
        default: all

permissions:
  contents: write

concurrency:
  group: android-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build signed ${{ inputs.build_type }} APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare version
        id: version
        shell: bash
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          BUMP_TYPE: ${{ inputs.version_bump }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          set -euo pipefail
          current_version="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          current_code="$(sed -n 's/^VERSION_CODE=//p' version.properties)"
          new_version="$current_version"
          new_code="$current_code"

          if [[ "$BUILD_TYPE" == "release" ]]; then
            if [[ "$BUMP_TYPE" == "custom" ]]; then
              if [[ ! "$CUSTOM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::custom_version must look like 1.2.3"
                exit 1
              fi
              new_version="$CUSTOM_VERSION"
            else
              IFS='.' read -r major minor patch <<< "$current_version"
              case "$BUMP_TYPE" in
                major) new_version="$((major + 1)).0.0" ;;
                minor) new_version="${major}.$((minor + 1)).0" ;;
                patch) new_version="${major}.${minor}.$((patch + 1))" ;;
                *) echo "::error::Unsupported version bump: $BUMP_TYPE"; exit 1 ;;
              esac
            fi
            new_code="$((current_code + 1))"
            printf 'VERSION_NAME=%s\nVERSION_CODE=%s\n' "$new_version" "$new_code" > version.properties
            if git rev-parse -q --verify "refs/tags/v${new_version}" >/dev/null; then
              echo "::error::Tag v${new_version} already exists"
              exit 1
            fi
          fi

          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "version_code=$new_code" >> "$GITHUB_OUTPUT"
          echo "tag=v${new_version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Building version $new_version ($new_code)"

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Android signing secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mvbar-release.jks"

      - name: Build signed APKs
        shell: bash
        env:
          MVBAR_RELEASE_STORE_FILE: ${{ runner.temp }}/mvbar-release.jks
          MVBAR_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          MVBAR_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          MVBAR_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          tasks=()
          if [[ "${{ inputs.build_type }}" == "release" || "${{ inputs.modules }}" == "all" ]]; then
            tasks+=(":app:assembleRelease" ":tv:assembleRelease" ":wear:assembleRelease")
          elif [[ "${{ inputs.modules }}" == "tv" ]]; then
            tasks+=(":tv:assembleRelease")
          else
            tasks+=(":app:assembleRelease")
          fi
          ./gradlew "${tasks[@]}" --build-cache --parallel --console=plain

      - name: Verify signed APKs
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/34.0.0"
          build_all=false
          [[ "${{ inputs.build_type }}" == "release" || "${{ inputs.modules }}" == "all" ]] && build_all=true

          if [[ "$build_all" == true || "${{ inputs.modules }}" == "app" ]]; then
            phone_apk="app/build/outputs/apk/release/app-release.apk"
            "$build_tools/apksigner" verify --verbose --print-certs "$phone_apk"
            badging="$("$build_tools/aapt" dump badging "$phone_apk")"
            printf '%s\n' "$badging" | sed -n "/^package:/p;/^sdkVersion:/p;/^targetSdkVersion:/p;/^native-code:/p;/android.hardware.type.watch/p"
            grep -q "^native-code:.*'arm64-v8a'" <<< "$badging" || {
              echo "::error::Phone APK does not advertise arm64-v8a support"
              exit 1
            }
            if grep -q "android.hardware.type.watch" <<< "$badging"; then
              echo "::error::Phone APK unexpectedly requires Wear OS hardware"
              exit 1
            fi
          fi

          if [[ "$build_all" == true || "${{ inputs.modules }}" == "tv" ]]; then
            tv_apk="tv/build/outputs/apk/release/tv-release.apk"
            "$build_tools/apksigner" verify --verbose --print-certs "$tv_apk"
            tv_badging="$("$build_tools/aapt" dump badging "$tv_apk")"
            printf '%s\n' "$tv_badging" | sed -n "/^package:/p;/^sdkVersion:/p;/^targetSdkVersion:/p;/android.software.leanback/p;/android.hardware.touchscreen/p"
            grep -q "uses-feature: name='android.software.leanback'" <<< "$tv_badging" || {
              echo "::error::TV APK does not require Android TV leanback support"
              exit 1
            }
            grep -q "uses-feature-not-required: name='android.hardware.touchscreen'" <<< "$tv_badging" || {
              echo "::error::TV APK unexpectedly requires a touchscreen"
              exit 1
            }
            grep -q "^leanback-launchable-activity:" <<< "$tv_badging" || {
              echo "::error::TV APK does not expose a Leanback launcher activity"
              exit 1
            }
          fi

          if [[ "$build_all" == true ]]; then
            wear_apk="wear/build/outputs/apk/release/wear-release.apk"
            "$build_tools/apksigner" verify --verbose --print-certs "$wear_apk"
            wear_badging="$("$build_tools/aapt" dump badging "$wear_apk")"
            printf '%s\n' "$wear_badging" | sed -n "/^package:/p;/^sdkVersion:/p;/^targetSdkVersion:/p;/android.hardware.type.watch/p"
            grep -q "android.hardware.type.watch" <<< "$wear_badging" || {
              echo "::error::Wear APK does not require Wear OS hardware"
              exit 1
            }
          fi

      - name: Collect APKs
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${{ steps.version.outputs.version }}"
          if [[ "${{ inputs.build_type }}" == "release" ]]; then
            phone_name="mvbar-android-arm64-${version}"
            tv_name="mvbar-tv-${version}"
            wear_name="mvbar-wear-${version}"
          else
            phone_name="mvbar-android-arm64-dev-${version}-${{ steps.version.outputs.short_sha }}"
            tv_name="mvbar-tv-dev-${version}-${{ steps.version.outputs.short_sha }}"
            wear_name="mvbar-wear-dev-${version}-${{ steps.version.outputs.short_sha }}"
          fi

          build_all=false
          [[ "${{ inputs.build_type }}" == "release" || "${{ inputs.modules }}" == "all" ]] && build_all=true
          if [[ "$build_all" == true || "${{ inputs.modules }}" == "app" ]]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/${phone_name}.apk"
          fi
          if [[ "$build_all" == true || "${{ inputs.modules }}" == "tv" ]]; then
            cp tv/build/outputs/apk/release/tv-release.apk "dist/${tv_name}.apk"
          fi
          if [[ "$build_all" == true ]]; then
            cp wear/build/outputs/apk/release/wear-release.apk "dist/${wear_name}.apk"
          fi
          (
            cd dist
            sha256sum ./*.apk > SHA256SUMS
          )

          if [[ "${{ inputs.build_type }}" == "release" ]]; then
            artifact_name="mvbar-release-${version}"
          elif [[ "${{ inputs.modules }}" == "all" ]]; then
            artifact_name="mvbar-dev-all-${version}-${{ steps.version.outputs.short_sha }}"
          elif [[ "${{ inputs.modules }}" == "tv" ]]; then
            artifact_name="$tv_name"
          else
            artifact_name="$phone_name"
          fi
          echo "name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.build_type == 'release' && 90 || 30 }}

      - name: Commit release version
        if: inputs.build_type == 'release'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore: bump Android version to ${{ steps.version.outputs.version }}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Android release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish GitHub release
        if: inputs.build_type == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --verify-tag \
            --title "MVBar Android ${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Remove signing keystore
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/mvbar-release.jks" ]]; then
            shred -u "$RUNNER_TEMP/mvbar-release.jks"
          fi
