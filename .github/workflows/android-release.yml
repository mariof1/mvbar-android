name: Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        type: choice
        options:
          - dev
          - release
        default: dev
      version_bump:
        description: Version bump (release only)
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
        default: patch
      custom_version:
        description: Custom version (e.g. 1.2.3) - only used if version_bump is custom
        required: false
        type: string
      modules:
        description: APK modules
        required: true
        type: choice
        options:
          - app
          - all
        default: app

permissions:
  contents: write

jobs:
  check:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APKs
        run: |
          chmod +x ./gradlew
          if [[ "${{ inputs.modules }}" == "all" ]]; then
            ./gradlew assembleDebug --console=plain
          else
            ./gradlew :app:assembleDebug --console=plain
          fi

  version:
    name: Bump Version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    if: inputs.build_type == 'release'
    outputs:
      version: ${{ steps.bump.outputs.version }}
      version_code: ${{ steps.bump.outputs.version_code }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate new version
        id: bump
        run: |
          CURRENT_VERSION="$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)"
          CURRENT_CODE="$(grep '^VERSION_CODE=' version.properties | cut -d= -f2)"
          BUMP_TYPE="${{ inputs.version_bump }}"
          CUSTOM="${{ inputs.custom_version }}"

          if [[ "$BUMP_TYPE" == "custom" ]]; then
            if [[ ! "$CUSTOM" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
              echo "::error::custom_version must look like 1.2.3"
              exit 1
            fi
            NEW_VERSION="$CUSTOM"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            case "$BUMP_TYPE" in
              major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
              minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
              *) NEW_VERSION="$CURRENT_VERSION" ;;
            esac
          fi

          NEW_CODE="$((CURRENT_CODE + 1))"
          TAG="v${NEW_VERSION}"

          {
            echo "VERSION_NAME=${NEW_VERSION}"
            echo "VERSION_CODE=${NEW_CODE}"
          } > version.properties

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${NEW_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "New Android version: ${NEW_VERSION} (${NEW_CODE})"

      - name: Commit version bump
        run: |
          git add version.properties
          git commit -m "chore: bump Android version to ${{ steps.bump.outputs.version }}"
          git push

      - name: Create and push tag
        run: |
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Android release ${{ steps.bump.outputs.version }}"
          git push origin "${{ steps.bump.outputs.tag }}"

  build-dev:
    name: Build Signed APK (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: check
    if: inputs.build_type == 'dev'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_KEYSTORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: ${name}"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mvbar-release.jks"

      - name: Build signed release APKs
        env:
          MVBAR_RELEASE_STORE_FILE: ${{ runner.temp }}/mvbar-release.jks
          MVBAR_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          MVBAR_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          MVBAR_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [[ "${{ inputs.modules }}" == "all" ]]; then
            ./gradlew assembleRelease --console=plain
          else
            ./gradlew :app:assembleRelease --console=plain
          fi

      - name: Collect APKs
        id: collect
        run: |
          VERSION="$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)"
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/mvbar-android-dev-${VERSION}-${SHORT_SHA}.apk"
          if [[ "${{ inputs.modules }}" == "all" ]]; then
            cp wear/build/outputs/apk/release/wear-release.apk "dist/mvbar-wear-dev-${VERSION}-${SHORT_SHA}.apk"
          fi
          echo "artifact_name=mvbar-android-dev-${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.artifact_name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  build-release:
    name: Build Signed APK (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: version
    if: inputs.build_type == 'release'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_KEYSTORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: ${name}"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mvbar-release.jks"

      - name: Build signed release APKs
        env:
          MVBAR_RELEASE_STORE_FILE: ${{ runner.temp }}/mvbar-release.jks
          MVBAR_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          MVBAR_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          MVBAR_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [[ "${{ inputs.modules }}" == "all" ]]; then
            ./gradlew assembleRelease --console=plain
          else
            ./gradlew :app:assembleRelease --console=plain
          fi

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/mvbar-android-${{ needs.version.outputs.version }}.apk"
          if [[ "${{ inputs.modules }}" == "all" ]]; then
            cp wear/build/outputs/apk/release/wear-release.apk "dist/mvbar-wear-${{ needs.version.outputs.version }}.apk"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvbar-android-${{ needs.version.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" dist/*.apk \
            --title "MVBar Android ${{ needs.version.outputs.version }}" \
            --notes "Signed Android APK release ${{ needs.version.outputs.version }} (${{ needs.version.outputs.version_code }})."
