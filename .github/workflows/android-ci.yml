name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phone-verify:
    name: Phone tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --build-cache --parallel --console=plain

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-verification-reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  tv-verify:
    name: TV tests, lint, and APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Run TV tests, lint, and debug build
        run: ./gradlew :tv:testDebugUnitTest :tv:lintDebug :tv:assembleDebug --build-cache --parallel --console=plain

      - name: Upload TV test APK
        uses: actions/upload-artifact@v6
        with:
          name: mvbar-tv-debug-${{ github.run_id }}
          path: tv/build/outputs/apk/debug/tv-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload TV verification reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tv-verification-reports-${{ github.run_id }}
          path: |
            tv/build/reports/tests/
            tv/build/reports/lint-results-*.html
            tv/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
