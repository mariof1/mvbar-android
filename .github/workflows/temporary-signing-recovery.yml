name: Temporary encrypted signing recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      RECIPIENT_PUBLIC_KEY_BASE64: 

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            test -n "$value"
          done

      - name: Create encrypted recovery bundle
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$RECIPIENT_PUBLIC_KEY_BASE64" | base64 --decode > recipient.pem
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > mvbar-release.jks
          {
            printf 'MVBAR_RELEASE_STORE_PASSWORD=%q\n' "$STORE_PASSWORD"
            printf 'MVBAR_RELEASE_KEY_ALIAS=%q\n' "$KEY_ALIAS"
            printf 'MVBAR_RELEASE_KEY_PASSWORD=%q\n' "$KEY_PASSWORD"
          } > signing.env
          tar -czf signing-bundle.tar.gz mvbar-release.jks signing.env
          openssl rand -hex 32 > bundle.pass
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in signing-bundle.tar.gz -out signing-bundle.enc -pass file:bundle.pass
          openssl pkeyutl -encrypt -pubin -inkey recipient.pem \
            -in bundle.pass -out bundle.pass.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          shred -u mvbar-release.jks signing.env signing-bundle.tar.gz bundle.pass recipient.pem

      - name: Upload encrypted bundle
        uses: actions/upload-artifact@v6
        with:
          name: temporary-signing-recovery
          path: |
            signing-bundle.enc
            bundle.pass.enc
          if-no-files-found: error
          retention-days: 1
